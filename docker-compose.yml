name: work-helper

services:
  app-redis:
    image: redis:7-alpine
    container_name: wh-app-redis
    ports:
      - "6391:6379"
    volumes:
      - wh-app-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wh-app-redis-data:
